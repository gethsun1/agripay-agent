name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@10.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm sbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cyclonedx-sbom
          path: artifacts/sbom.cdx.json
      - name: Tracked-file secret patterns
        run: '! git grep -nEI "(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|HEDERA_[A-Z_]*PRIVATE_KEY=[A-Za-z0-9]{32}|GROQ_API_KEY=gsk_)" -- ":(exclude)pnpm-lock.yaml"'
